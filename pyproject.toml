[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acfsa-rag-experiment"
version = "0.1.0"
description = "Adaptive context filtering and structuring for RAG agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<4.0",
  "matplotlib>=3.8,<4.0",
  "PyYAML>=6.0,<7.0",
  "sentence-transformers>=3.0,<6.0",
  "tiktoken>=0.7,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "openai>=1.40,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
